name: iOS layout smoke

on:
  push:
    branches: [main]
    paths:
      - ios/RailMap/**
      - ios/RailMapUITests/**
      - ios/RailKit/**
      - ios/RailMap.xcodeproj/**
      - ios/copy-rail-packages.sh
      - app/public/rail/**
      - ios/tools/verify-layout-ui-smoke.sh
      - .github/workflows/ios-layout-smoke.yml
  pull_request:
    paths:
      - ios/RailMap/**
      - ios/RailMapUITests/**
      - ios/RailKit/**
      - ios/RailMap.xcodeproj/**
      - ios/copy-rail-packages.sh
      - app/public/rail/**
      - ios/tools/verify-layout-ui-smoke.sh
      - .github/workflows/ios-layout-smoke.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-layout-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-sidebar:
    name: Wide iPad workspace sidebar
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Run focused layout smoke test
        working-directory: ios
        env:
          SCRATCH: ${{ runner.temp }}/layout-ui-smoke
        run: tools/verify-layout-ui-smoke.sh

      - name: Preserve failed iPad UI result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-layout-ui-result
          path: |
            ${{ runner.temp }}/layout-ui-smoke/*.xcresult
            ${{ runner.temp }}/layout-ui-smoke/*.log
          if-no-files-found: ignore

  iphone-workspace:
    name: iPhone workspace regression
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Run workspace UI regression
        working-directory: ios
        env:
          SCRATCH: ${{ runner.temp }}/workspace-ui-regression
        run: tools/verify-layout-ui-smoke.sh iphone

      - name: Preserve failed iPhone UI result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-workspace-ui-result
          path: |
            ${{ runner.temp }}/workspace-ui-regression/*.xcresult
            ${{ runner.temp }}/workspace-ui-regression/*.log
          if-no-files-found: ignore
