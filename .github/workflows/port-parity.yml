# Keeps the Swift port honest.
#
# The port is verified rather than reviewed: port-fixtures/*.json holds inputs
# and the answers the JavaScript gives, and the Swift has to reproduce them.
# That only means anything while the fixtures still describe the JavaScript, so
# the first half of the check — "did the reference implementation move without
# the fixtures being regenerated?" — runs on every push. Two geometry fixtures
# contain bit-exact V8 answers, so this uses the same macOS ARM environment that
# generated the committed corpus instead of silently comparing x64 answers.
#
# A stale fixture makes every Swift result meaningless, so both halves stay as
# separate required checks even though they share the supported runner image.

name: Port parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: port-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: iOS source ownership and dependency boundaries
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify responsibility manifest and module imports
        run: ./ios/verify.sh --boundaries

  fixtures:
    name: Fixtures still describe the JavaScript
    # overlap-lanes and station-join-smoothing pin bit-exact geometry. The V8
    # version is pinned below, and the CPU architecture is pinned here: x64 and
    # ARM can disagree in the last bit after long floating-point pipelines.
    runs-on: xcode-27
    # Historical-route fixtures compare browser and precompute results in
    # isolated batches, rebuilding the national indexes for each dated case.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Fixture bytes include V8 fdlibm results and error text. Pin the
          # exact engine used to generate the committed corpus; a Node major
          # upgrade is a deliberate fixture migration, not a CI detail.
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # --check regenerates into memory and fails if any answer moved. If this
      # is red, that is not a broken build — it is a list of answers the Swift
      # port now has to be re-verified against. Regenerate deliberately and
      # read the diff.
      - name: Fixtures match the code that generated them
        working-directory: app
        env:
          # Peak heap is set by the largest SINGLE builder, not by the size of
          # the corpus: fixtures are rendered and released one at a time, so
          # adding a fixture no longer raises the ceiling. route-graph and
          # station-join-smoothing each reach ~2.9 GB while they run, which is
          # above Node's default ~2 GB old-space ceiling — V8 otherwise aborts
          # before it can compare the files. Run the generator with --stats to
          # see the per-fixture heap behind this number.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build/build-port-fixtures.mjs --check

      # The fixtures pin the two ports to each other; they cannot pin what the
      # answer has to BE — regenerate and both sides agree on the new shape,
      # however bad it is. app/tests/continuous-stroke-geometry.test.mjs is
      # that missing half on the JavaScript side (its Swift twin runs in the
      # `swift` job below), so it belongs on the same fixture bytes this job
      # just verified.
      - name: Drawn geometry is well formed
        working-directory: app
        run: npm test

      - name: OSM subdivision requires complete coverage
        run: python3 -m unittest discover -s app/scripts/railway/tests -p test_na_osm_tile_completion.py

  swift:
    name: RailCore matches the fixtures
    # This repository is developed and verified with Xcode 27 / Swift 6.4.
    # macos-15 currently selects Xcode 16.4 / Swift 6.1.2, whose Foundation
    # formatter cannot emit the 1,085-digit exact decimal used by the
    # JavaScript toFixed parity check and silently takes the fallback path.
    runs-on: xcode-27
    timeout-minutes: 30
    # Skipped on pushes that cannot affect it; always available by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # --core verifies all three package targets, their tests and native
      # behavior harnesses. RailCore has a scoped SQLite exception; Application
      # and Presentation are separate consumers. Simulator/UI builds run in
      # the dedicated app workflow and remain a separate integration gate.
      - name: Parity suite
        working-directory: ios
        run: SCRATCH="${RUNNER_TEMP}/railkit" ./verify.sh --core
