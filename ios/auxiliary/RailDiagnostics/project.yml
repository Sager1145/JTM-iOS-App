name: RailDiagnostics
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  RailKit:
    path: ../../RailKit
  InspectionKit:
    path: ../RailAlignmentInspector/InspectionKit
  WorkbenchCore:
    path: ../ThroughWorkbench/WorkbenchCore
targets:
  RailDiagnostics:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        LSRequiresIPhoneOS: true
        LSMultipleInstancesProhibited: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Diagnostic request JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        LSSupportsOpeningDocumentsInPlace: true
    sources:
      - path: Sources
      - path: ../../RailMap
      - path: ../RouteWorkbench/App
      - path: ../RailAlignmentInspector/Sources
      - path: ../RailAlignmentInspector/Resources
        buildPhase: resources
      - path: ../RailAlignmentInspector/Assets.xcassets
        excludes:
          - AppIcon.appiconset
      - path: ../ThroughWorkbench/App/Assets.xcassets
        excludes:
          - AppIcon.appiconset
      - path: ../ThroughWorkbench/App
        excludes:
          - ThroughWorkbenchApp.swift
          - Info.plist
          - Assets.xcassets
    dependencies:
      - package: RailKit
        product: RailCore
      - package: RailKit
        product: RailPresentation
      - package: RailKit
        product: RailApplication
      - package: InspectionKit
        product: RailInspection
      - package: WorkbenchCore
        product: WorkbenchCore
    postBuildScripts:
      - name: Copy production railway resources
        script: |
          "$SRCROOT/../../copy-rail-packages.sh"
          cp "$SRCROOT/../../RailKit/Sources/RailCore/Resources/japan-through-services.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/japan-through-services.json"
          cp "$SRCROOT/../../../app/data/rail-history.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/rail-history.json"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.JRM.RailDiagnostics
        PRODUCT_NAME: RailDiagnostics
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) RAIL_DIAGNOSTICS'
        ASSETCATALOG_COMPILER_APPICON_NAME: RouteWorkbenchIcon
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rail Diagnostics
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_VERSION: '6.0'
        CODE_SIGN_IDENTITY: '-'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  RailDiagnostics:
    build:
      targets:
        RailDiagnostics: all
