<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon, default appearance. Lifted verbatim from the design deck's
       `7b` — "站點點陣" — in "iOS应用icon设计方案" (App Icon.dc.html#7b).
       Do not retype these numbers: the polyline's three segments are equal
       length and its two bends are point-symmetric, and both properties are
       lost the moment a coordinate is rounded by hand. -->
  <rect width="1024" height="1024" fill="#0A84FF"/>

  <!-- The background: a lattice of stations, the map zoomed out far enough
       that only the stops are left. -->
  <g fill="#FFFFFF" fill-opacity="0.28">
    <circle cx="152" cy="152" r="22"/><circle cx="392" cy="152" r="22"/><circle cx="632" cy="152" r="22"/><circle cx="872" cy="152" r="22"/>
    <circle cx="152" cy="392" r="22"/><circle cx="392" cy="392" r="22"/><circle cx="632" cy="392" r="22"/><circle cx="872" cy="392" r="22"/>
    <circle cx="152" cy="632" r="22"/><circle cx="392" cy="632" r="22"/><circle cx="632" cy="632" r="22"/><circle cx="872" cy="632" r="22"/>
    <circle cx="152" cy="872" r="22"/><circle cx="392" cy="872" r="22"/><circle cx="632" cy="872" r="22"/><circle cx="872" cy="872" r="22"/>
  </g>

  <!-- The ridden run, and the two stations it ran between. -->
  <path d="M 247 781 L 382 547 L 643 477 L 778 243" fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="247" cy="781" r="72" fill="#0A84FF" stroke="#FFFFFF" stroke-width="46"/>
  <circle cx="778" cy="243" r="72" fill="#0A84FF" stroke="#FFFFFF" stroke-width="46"/>
</svg>
