<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon, dark appearance. Every coordinate is `icon-light.svg`; the
       only edit is the ground.
       The HIG asks for the light icon as the basis for the dark one, for the
       default palette to survive, and for a colour background rather than a
       black one — so the ground is the same hue as #0A84FF taken down to
       about half brightness, and the run and its stations stay pure white
       instead of being dimmed along with it. Nothing is swapped in or out,
       so the icon reads as the same mark in either appearance. -->
  <rect width="1024" height="1024" fill="#0B498C"/>

  <g fill="#FFFFFF" fill-opacity="0.28">
    <circle cx="152" cy="152" r="22"/><circle cx="392" cy="152" r="22"/><circle cx="632" cy="152" r="22"/><circle cx="872" cy="152" r="22"/>
    <circle cx="152" cy="392" r="22"/><circle cx="392" cy="392" r="22"/><circle cx="632" cy="392" r="22"/><circle cx="872" cy="392" r="22"/>
    <circle cx="152" cy="632" r="22"/><circle cx="392" cy="632" r="22"/><circle cx="632" cy="632" r="22"/><circle cx="872" cy="632" r="22"/>
    <circle cx="152" cy="872" r="22"/><circle cx="392" cy="872" r="22"/><circle cx="632" cy="872" r="22"/><circle cx="872" cy="872" r="22"/>
  </g>

  <path d="M 247 781 L 382 547 L 643 477 L 778 243" fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="247" cy="781" r="72" fill="#0B498C" stroke="#FFFFFF" stroke-width="46"/>
  <circle cx="778" cy="243" r="72" fill="#0B498C" stroke="#FFFFFF" stroke-width="46"/>
</svg>
